name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Take new Linux screenshots instead of comparing; download them from the run's artifacts"
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a PR supersedes the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Build the page from the committed snapshot
        run: python build.py build --out dist/index.html

  # Screenshot tests (tests/visual). Baselines are per operating system; CI uses tests/visual/baselines/linux.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Playwright and Chromium
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium
      - name: Compare screenshots with the baselines
        if: ${{ !inputs.update_visual_baselines }}
        run: python -m tests.visual
      - name: Take new baselines
        if: ${{ inputs.update_visual_baselines }}
        run: python -m tests.visual --update
      - name: Upload the new baselines
        if: ${{ inputs.update_visual_baselines }}
        uses: actions/upload-artifact@v5
        with:
          name: linux-baselines
          path: tests/visual/baselines/linux
      - name: Upload what the page looked like, next to the baselines
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: visual-report
          path: tests/visual/output
