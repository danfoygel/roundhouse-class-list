name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Build the page from the committed snapshot
        run: python build.py build --out dist/index.html
