name: Update class list

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, at 17 minutes past
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]  # our own data commits (below) must not retrigger this workflow

permissions:
  contents: write  # the build job commits the refreshed data/snapshot.json and data/changelog.json back to main
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Fetch Mindbody data and build the page
        run: python build.py refresh --out dist/index.html
      - name: Commit the refreshed snapshot and changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Refresh Mindbody data [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
