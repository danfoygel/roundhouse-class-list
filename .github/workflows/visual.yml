name: Visual tests

# Screenshot tests (tests/visual) take over a minute, so they run nightly on main instead of on
# every pull request. A failure emails the repository owner; the run's `visual-report` artifact
# shows baseline, actual and difference side by side.
on:
  schedule:
    - cron: "23 10 * * *"   # daily, 10:23 UTC (3:23 am Pacific)
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Take new Linux screenshots instead of comparing; download them from the run's artifacts"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual:
    # Pinned, not ubuntu-latest: the Linux baselines depend on the runner's fonts and rasterizer,
    # so an image upgrade would change every screenshot at once.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Playwright and Chromium
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium
      # Baselines are per operating system; this job uses tests/visual/baselines/linux.
      - name: Compare screenshots with the baselines
        if: ${{ !inputs.update_visual_baselines }}
        run: python -m tests.visual
      - name: Take new baselines
        if: ${{ inputs.update_visual_baselines }}
        run: python -m tests.visual --update
      - name: Upload the new baselines
        if: ${{ inputs.update_visual_baselines }}
        uses: actions/upload-artifact@v5
        with:
          name: linux-baselines
          path: tests/visual/baselines/linux
      - name: Upload what the page looked like, next to the baselines
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: visual-report
          path: tests/visual/output
